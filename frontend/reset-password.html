<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — FitTrack AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/cursor.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .rp-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      background: #050510;
    }
    .rp-wrapper::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
      top: -100px; left: -100px;
      pointer-events: none;
    }
    .rp-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 40px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(20px);
    }
    .rp-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: rgba(241,245,249,0.4);
      text-decoration: none;
      margin-bottom: 36px;
      transition: color 0.2s;
    }
    .rp-back-link:hover { color: rgba(241,245,249,0.75); }
    .rp-icon-wrap {
      width: 64px; height: 64px;
      background: rgba(6,182,212,0.1);
      border: 2px solid rgba(6,182,212,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #06b6d4;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(6,182,212,0.15);
    }
    .rp-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #f1f5f9;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }
    .rp-subtitle {
      font-size: 0.875rem;
      color: rgba(241,245,249,0.45);
      line-height: 1.65;
      margin-bottom: 32px;
    }
    .rp-token-note {
      background: rgba(245,158,11,0.07);
      border: 1px solid rgba(245,158,11,0.18);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.79rem;
      color: rgba(253,211,77,0.75);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    [data-theme="light"] .rp-wrapper { background: #f5f7ff; }
    [data-theme="light"] .rp-card { background: rgba(255,255,255,0.9); border-color: rgba(124,58,237,0.1); }
    [data-theme="light"] .rp-title { color: #1e1b4b; }
    [data-theme="light"] .rp-subtitle { color: rgba(30,27,75,0.5); }
    [data-theme="light"] .rp-back-link { color: rgba(30,27,75,0.4); }
    [data-theme="light"] .form-label { color: rgba(30,27,75,0.65); }
    [data-theme="light"] .form-input { background: rgba(255,255,255,0.95); border-color: rgba(124,58,237,0.15); color: #1e1b4b; }
    .theme-btn { position: fixed; top: 16px; right: 16px; z-index: 999; width: 36px; height: 36px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: rgba(241,245,249,0.7); font-size: 0.9rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
    .theme-btn:hover { background: rgba(124,58,237,0.15); border-color: rgba(167,139,250,0.3); color: #a78bfa; }
    [data-theme="light"] .theme-btn { background: rgba(124,58,237,0.08); border-color: rgba(124,58,237,0.15); color: #7c3aed; }
  </style>
</head>
<body class="auth-page">

  <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
    <i class="fas fa-moon" id="themeIcon"></i>
  </button>

  <div class="rp-wrapper">
    <div class="rp-card">
      <a href="forgot-password.html" class="rp-back-link">
        <i class="fas fa-arrow-left"></i> Back to forgot password
      </a>

      <div class="rp-icon-wrap"><i class="fas fa-key"></i></div>
      <h1 class="rp-title">Set new password</h1>
      <p class="rp-subtitle">Enter your new password below. Make it strong with uppercase, numbers, and symbols.</p>

      <div class="rp-token-note" id="rpTokenNote">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="rpTokenMsg">Loading reset token from URL...</span>
      </div>

      <div class="auth-error hidden" id="rpError">
        <i class="fas fa-exclamation-circle"></i>
        <span id="rpErrorMsg">Reset failed.</span>
      </div>

      <form class="auth-form" onsubmit="handleResetPassword(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="newPassword">
            <i class="fas fa-lock"></i> New Password
          </label>
          <div class="form-input-wrap">
            <input type="password" class="form-input has-icon" id="newPassword"
              placeholder="Min. 6 characters" required autocomplete="new-password"
              oninput="checkPasswordStrength(this.value)" />
            <button type="button" class="input-eye-btn" onclick="togglePwd('newPassword', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="password-strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">
            <i class="fas fa-lock"></i> Confirm Password
          </label>
          <div class="form-input-wrap">
            <input type="password" class="form-input has-icon" id="confirmPassword"
              placeholder="Repeat new password" required autocomplete="new-password" />
            <button type="button" class="input-eye-btn" onclick="togglePwd('confirmPassword', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="resetBtn">
          <i class="fas fa-check-circle"></i>
          <span>Reset Password</span>
        </button>
      </form>

      <div class="auth-switch" style="margin-top: 24px; font-size: 0.82rem;">
        Remember your password? <a href="login.html">Sign in →</a>
      </div>
    </div>
  </div>

  <div class="auth-toast" id="authToast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/cursor.js"></script>
  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('fittrack-theme', next);
      document.getElementById('themeIcon').className = next === 'light' ? 'fas fa-sun' : 'fas fa-moon';
    }
    (function() {
      const saved = localStorage.getItem('fittrack-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      const icon = document.getElementById('themeIcon');
      if (icon) icon.className = saved === 'light' ? 'fas fa-sun' : 'fas fa-moon';
      // Validate token in URL
      const token = new URLSearchParams(window.location.search).get('token');
      const note = document.getElementById('rpTokenNote');
      const msg = document.getElementById('rpTokenMsg');
      if (token) {
        note.style.background = 'rgba(16,185,129,0.07)';
        note.style.borderColor = 'rgba(16,185,129,0.2)';
        note.style.color = 'rgba(110,231,183,0.8)';
        note.querySelector('i').className = 'fas fa-check-circle';
        msg.textContent = 'Valid reset token found. Enter your new password.';
      } else {
        msg.textContent = 'No reset token found in URL. Please request a new reset link.';
        document.querySelector('button[type="submit"]').disabled = true;
      }
    })();
  </script>
</body>
</html>
