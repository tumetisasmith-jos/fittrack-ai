<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack AI — Frontend Test Suite | Team Vitalis</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--green:#c4f135;--green-dim:rgba(196,241,53,.08);--purple:#7c3aed;--purple-l:#a78bfa;--red:#ef4444;--orange:#f97316;--cyan:#06b6d4;--emerald:#10b981;--bg:#080808;--bg2:#0d0d0d;--card:rgba(255,255,255,.04);--card-border:rgba(255,255,255,.07);--border:rgba(255,255,255,.05);--hover:rgba(255,255,255,.06);--text:#f8fafc;--text-muted:#a1a1aa;--text-dim:#52525b;--radius:14px;--transition:all .2s ease;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;border:none;background:none;}
    /* HEADER */
    .header{background:linear-gradient(135deg,rgba(196,241,53,.05),rgba(124,58,237,.05));border-bottom:1px solid rgba(196,241,53,.12);padding:24px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
    .header-brand{display:flex;align-items:center;gap:12px;}
    .header-icon{width:42px;height:42px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#080808;font-size:1rem;box-shadow:0 0 18px rgba(196,241,53,.3);}
    .header-title{font-family:'Outfit';font-size:1.3rem;font-weight:900;letter-spacing:-.03em;}
    .header-title span{color:var(--green);}
    .header-sub{font-size:.78rem;color:var(--text-muted);margin-top:2px;}
    .run-btn{display:flex;align-items:center;gap:8px;padding:10px 22px;background:var(--green);color:#080808;border-radius:10px;font-size:.88rem;font-weight:700;transition:var(--transition);}
    .run-btn:hover{background:#d4f535;transform:translateY(-1px);}
    /* SUMMARY BAR */
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:20px 32px;border-bottom:1px solid var(--border);}
    .sum-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px;text-align:center;}
    .sum-val{font-family:'Outfit';font-size:1.6rem;font-weight:900;line-height:1;}
    .sum-label{font-size:.68rem;color:var(--text-muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
    .sum-val.pass{color:var(--green);}
    .sum-val.fail{color:var(--red);}
    .sum-val.skip{color:var(--orange);}
    .sum-val.total{color:var(--cyan);}
    /* PROGRESS */
    .progress-wrap{padding:0 32px 16px;}
    .progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#a3e635);border-radius:100px;transition:width .8s ease;}
    .progress-label{font-size:.72rem;color:var(--text-dim);margin-top:5px;text-align:right;}
    /* TABS */
    .tabs{display:flex;gap:6px;padding:0 32px 16px;flex-wrap:wrap;}
    .tab{padding:6px 14px;border-radius:8px;font-size:.78rem;font-weight:700;color:var(--text-dim);border:1px solid transparent;cursor:pointer;transition:var(--transition);}
    .tab.active{background:var(--green-dim);color:var(--green);border-color:rgba(196,241,53,.15);}
    .tab:hover:not(.active){background:var(--hover);color:var(--text-muted);}
    /* CONTENT */
    .content{padding:0 32px 40px;}
    /* SUITE */
    .suite{margin-bottom:24px;}
    .suite-header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--card);border:1px solid var(--card-border);border-radius:12px 12px 0 0;border-bottom:none;cursor:pointer;}
    .suite-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0;}
    .suite-name{font-family:'Outfit';font-size:.95rem;font-weight:800;flex:1;}
    .suite-stats{font-size:.72rem;color:var(--text-muted);display:flex;gap:12px;}
    .suite-stats .s-pass{color:var(--green);}
    .suite-stats .s-fail{color:var(--red);}
    .suite-toggle{color:var(--text-dim);transition:var(--transition);}
    .suite-toggle.open{transform:rotate(180deg);}
    /* TESTS */
    .tests{background:rgba(255,255,255,.015);border:1px solid var(--card-border);border-radius:0 0 12px 12px;overflow:hidden;}
    .test-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);transition:var(--transition);}
    .test-row:last-child{border-bottom:none;}
    .test-row:hover{background:var(--hover);}
    /* STATUS ICONS */
    .status-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;}
    .status-pass{background:rgba(16,185,129,.12);color:var(--emerald);}
    .status-fail{background:rgba(239,68,68,.12);color:var(--red);}
    .status-skip{background:rgba(249,115,22,.12);color:var(--orange);}
    .status-pending{background:rgba(255,255,255,.05);color:var(--text-dim);}
    /* TEST INFO */
    .test-id{font-family:'JetBrains Mono';font-size:.7rem;color:var(--text-dim);min-width:80px;flex-shrink:0;}
    .test-name{font-size:.84rem;font-weight:500;flex:1;}
    .test-name.fail{color:var(--red);}
    .test-page{font-size:.68rem;color:var(--text-dim);font-family:'JetBrains Mono';}
    .test-type{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;}
    .type-ui{background:rgba(167,139,250,.1);color:var(--purple-l);}
    .type-func{background:rgba(6,182,212,.1);color:var(--cyan);}
    .type-resp{background:rgba(249,115,22,.1);color:var(--orange);}
    .type-perf{background:rgba(196,241,53,.08);color:var(--green);}
    .type-nav{background:rgba(16,185,129,.1);color:var(--emerald);}
    .test-time{font-size:.65rem;color:var(--text-dim);font-family:'JetBrains Mono';min-width:44px;text-align:right;}
    /* DETAIL PANEL */
    .detail-panel{display:none;padding:12px 18px;background:rgba(0,0,0,.3);border-top:1px solid var(--border);font-size:.78rem;color:var(--text-muted);}
    .detail-panel.show{display:block;}
    .detail-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:4px;}
    .detail-msg{font-family:'JetBrains Mono';font-size:.72rem;padding:8px;background:rgba(255,255,255,.03);border-radius:6px;margin-bottom:8px;border-left:3px solid var(--card-border);}
    .detail-msg.fail{border-left-color:var(--red);color:#f87171;}
    .detail-msg.pass{border-left-color:var(--green);color:var(--green);}
    /* LOG */
    .log-section{margin-top:24px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;overflow:hidden;}
    .log-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
    .log-title{font-family:'Outfit';font-size:.9rem;font-weight:800;}
    .log-clear{font-size:.72rem;color:var(--text-dim);cursor:pointer;transition:color .2s;}
    .log-clear:hover{color:var(--red);}
    .log-body{font-family:'JetBrains Mono';font-size:.72rem;padding:14px 18px;max-height:220px;overflow-y:auto;line-height:1.8;color:var(--text-muted);scrollbar-width:thin;}
    .log-pass{color:var(--green);}
    .log-fail{color:var(--red);}
    .log-skip{color:var(--orange);}
    .log-info{color:var(--cyan);}
    .log-dim{color:var(--text-dim);}
    /* FOOTER */
    .footer{padding:20px 32px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:.72rem;color:var(--text-dim);}
    /* RESPONSIVE */
    @media(max-width:768px){.summary{grid-template-columns:repeat(3,1fr);}.header,.summary,.tabs,.content,.progress-wrap,.footer{padding-left:16px;padding-right:16px;}.test-page,.test-time,.type-resp,.type-perf{display:none;}}
  </style>
</head>

// =============================================
// TEST ENGINE
// =============================================

const BASE = '../';   // relative to this file (adjust if needed)
const results = {};   // id → { status, msg, time }
const log = [];
let activeFilter = 'all';

// Check helpers (synchronous, DOM-based via iframe or fetch)
function simPass(msg) { return { status:'pass', msg }; }
function simSkip(msg) { return { status:'skip', msg }; }

function checkLocalStorage(key) {
  const val = localStorage.getItem(key);
  return val
    ? { status:'pass', msg:`${key} = "${val.substring(0,30)}..."` }
    : { status:'skip', msg:`${key} not set (expected after login)` };
}

function checkPageExists(page) {
  // Synchronous check via iframe (best effort)
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('HEAD', page, false);
    xhr.send();
    if (xhr.status >= 200 && xhr.status < 400) return { status:'pass', msg:`HTTP ${xhr.status} – ${page} is reachable` };
    return { status:'fail', msg:`HTTP ${xhr.status} – ${page} returned error` };
  } catch(e) {
    return { status:'skip', msg:`Network check skipped (${e.message}) — run from a server` };
  }
}

function checkElement(page, selector) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', page, false);
    xhr.send();
    const html = xhr.responseText;
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const el = doc.querySelector(selector);
    return el
      ? { status:'pass', msg:`Found: <${el.tagName.toLowerCase()}> matching "${selector}"` }
      : { status:'fail', msg:`No element matches selector: "${selector}" in ${page}` };
  } catch(e) { return { status:'skip', msg:`Could not fetch ${page}: ${e.message}` }; }
}

function checkText(page, search) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', page, false);
    xhr.send();
    const found = xhr.responseText.toLowerCase().includes(search.toLowerCase());
    return found
      ? { status:'pass', msg:`Text "${search}" found in ${page}` }
      : { status:'fail', msg:`Text "${search}" NOT found in ${page}` };
  } catch(e) { return { status:'skip', msg:`Could not fetch ${page}: ${e.message}` }; }
}

function checkTitle(page, expected) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', page, false);
    xhr.send();
    const parser = new DOMParser();
    const doc = parser.parseFromString(xhr.responseText, 'text/html');
    const title = doc.querySelector('title')?.textContent || '';
    return title.toLowerCase().includes(expected.toLowerCase())
      ? { status:'pass', msg:`Title: "${title}"` }
      : { status:'fail', msg:`Title "${title}" does not include "${expected}"` };
  } catch(e) { return { status:'skip', msg: e.message }; }
}

function checkHref(page, href) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', page, false);
    xhr.send();
    const found = xhr.responseText.includes(href);
    return found
      ? { status:'pass', msg:`Link to "${href}" found` }
      : { status:'fail', msg:`Link to "${href}" NOT found in ${page}` };
  } catch(e) { return { status:'skip', msg: e.message }; }
}

function checkMeta(page) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', page, false);
    xhr.send();
    const found = xhr.responseText.includes('viewport');
    return found
      ? { status:'pass', msg:'<meta name="viewport"> present' }
      : { status:'fail', msg:'No viewport meta tag found in ' + page };
  } catch(e) { return { status:'skip', msg: e.message }; }
}

function checkCSS(page, keyword) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', page, false);
    xhr.send();
    return xhr.responseText.includes(keyword)
      ? { status:'pass', msg:`CSS keyword "${keyword}" found` }
      : { status:'fail', msg:`CSS keyword "${keyword}" NOT found in ${page}` };
  } catch(e) { return { status:'skip', msg: e.message }; }
}

function checkFileSize(page, maxKB) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', page, false);
    xhr.send();
    const kb = Math.round(xhr.responseText.length / 1024);
    return kb <= maxKB
      ? { status:'pass', msg:`${page} is ${kb} KB (≤ ${maxKB} KB)` }
      : { status:'fail', msg:`${page} is ${kb} KB (exceeds ${maxKB} KB limit)` };
  } catch(e) { return { status:'skip', msg: e.message }; }
}

// =============================================
// RUN TESTS
// =============================================

async function runAllTests() {
  log.length = 0;
  addLog('info', `▶ Test run started — ${new Date().toLocaleTimeString()}`);
  addLog('info', `   Testing ${SUITES.reduce((a,s)=>a+s.tests.length,0)} test cases across ${SUITES.length} suites`);

  const startTime = performance.now();

  for (const suite of SUITES) {
    addLog('info', `\n📋 Suite: ${suite.name}`);
    for (const test of suite.tests) {
      const t0 = performance.now();
      let res;
      try { res = test.fn(); } catch(e) { res = { status:'fail', msg: e.message }; }
      const dur = Math.round(performance.now() - t0);
      results[test.id] = { ...res, time: dur };

      const icon = res.status === 'pass' ? '✅' : res.status === 'fail' ? '❌' : '⚠️';
      addLog(res.status, `  ${icon} [${test.id}] ${test.name} — ${dur}ms`);
      if (res.status !== 'pass') addLog('dim', `     → ${res.msg}`);
    }
  }

  const totalTime = Math.round(performance.now() - startTime);
  updateSummary(totalTime);
  render();
  addLog('info', `\n✅ Test run complete — ${totalTime}ms`);
  renderLog();
}

function updateSummary(totalTime) {
  const all = SUITES.flatMap(s => s.tests);
  const pass = all.filter(t => results[t.id]?.status === 'pass').length;
  const fail = all.filter(t => results[t.id]?.status === 'fail').length;
  const skip = all.filter(t => results[t.id]?.status === 'skip').length;
  const total = all.length;
  const pct = total ? Math.round((pass / total) * 100) : 0;

  document.getElementById('sumTotal').textContent = total;
  document.getElementById('sumPass').textContent  = pass;
  document.getElementById('sumFail').textContent  = fail;
  document.getElementById('sumSkip').textContent  = skip;
  document.getElementById('sumTime').textContent  = totalTime + 'ms';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${pass} / ${total} passed (${pct}%)`;

  const failTab = document.getElementById('failTab');
  failTab.textContent = `❌ Failed (${fail})`;
}

// =============================================
// RENDER
// =============================================

function render() {
  const container = document.getElementById('testContent');
  container.innerHTML = '';

  for (const suite of SUITES) {
    const filtered = activeFilter === 'all'  ? suite.tests
                   : activeFilter === 'fail' ? suite.tests.filter(t => results[t.id]?.status === 'fail')
                   : suite.tests.filter(t => t.type === activeFilter);

    if (filtered.length === 0) continue;

    const pass = filtered.filter(t => results[t.id]?.status === 'pass').length;
    const fail = filtered.filter(t => results[t.id]?.status === 'fail').length;
    const hasRun = Object.keys(results).length > 0;

    const el = document.createElement('div');
    el.className = 'suite';
    el.innerHTML = `
      <div class="suite-header" onclick="toggleSuite('suite-${suite.id}',this)">
        <div class="suite-icon" style="background:${suite.color}22;color:${suite.color};font-size:1rem;">${suite.icon}</div>
        <div class="suite-name">${suite.name}</div>
        <div class="suite-stats">
          <span class="s-pass">${hasRun ? pass+' passed' : filtered.length+' tests'}</span>
          ${hasRun && fail > 0 ? `<span class="s-fail">${fail} failed</span>` : ''}
        </div>
        <i class="fas fa-chevron-down suite-toggle open" id="toggle-suite-${suite.id}"></i>
      </div>
      <div class="tests" id="suite-${suite.id}">
        ${filtered.map(t => {
          const r = results[t.id];
          const status = r?.status || 'pending';
          const iconCls = status==='pass'?'fa-check':status==='fail'?'fa-times':status==='skip'?'fa-minus':'fa-circle';
          const iconColor = status==='pass'?'status-pass':status==='fail'?'status-fail':status==='skip'?'status-skip':'status-pending';
          const typeCls = `type-${t.type.toLowerCase()}`;
          return `
          <div class="test-row" onclick="toggleDetail('${t.id}')">
            <div class="status-icon ${iconColor}"><i class="fas ${iconCls}"></i></div>
            <div class="test-id">${t.id}</div>
            <div class="test-name ${status==='fail'?'fail':''}">${t.name}</div>
            <div class="test-page">${t.page}</div>
            <div class="test-type ${typeCls}">${t.type}</div>
            <div class="test-time">${r?.time ?? '—'}ms</div>
          </div>
          <div class="detail-panel" id="detail-${t.id}">
            <div class="detail-label">Result Message</div>
            <div class="detail-msg ${status}">${r ? r.msg : 'Test not yet run — click "Run All Tests"'}</div>
          </div>`;
        }).join('')}
      </div>`;
    container.appendChild(el);
  }

  // Log section
  const logEl = document.createElement('div');
  logEl.className = 'log-section';
  logEl.innerHTML = `
    <div class="log-header">
      <div class="log-title"><i class="fas fa-terminal" style="color:var(--green);margin-right:6px;"></i>Test Output Log</div>
      <span class="log-clear" onclick="clearLog()">Clear</span>
    </div>
    <div class="log-body" id="logBody">${renderLogLines()}</div>`;
  container.appendChild(logEl);
}

function toggleSuite(id, header) {
  const el = document.getElementById(id);
  const icon = document.getElementById('toggle-' + id);
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  icon.classList.toggle('open', !open);
}

function toggleDetail(id) {
  const el = document.getElementById('detail-' + id);
  el.classList.toggle('show');
}

function filterTests(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// LOG
function addLog(type, msg) { log.push({ type, msg }); }

function renderLogLines() {
  if (log.length === 0) return '<span style="color:var(--text-dim);">No test output yet. Click "Run All Tests" to begin.</span>';
  return log.map(l => {
    const cls = l.type === 'pass' ? 'log-pass' : l.type === 'fail' ? 'log-fail' : l.type === 'skip' ? 'log-skip' : l.type === 'info' ? 'log-info' : 'log-dim';
    return `<span class="${cls}">${escapeHtml(l.msg)}</span>`;
  }).join('<br>');
}

function renderLog() {
  const el = document.getElementById('logBody');
  if (el) { el.innerHTML = renderLogLines(); el.scrollTop = el.scrollHeight; }
}

function clearLog() { log.length = 0; renderLog(); }

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// INIT
window.addEventListener('DOMContentLoaded', () => { render(); });
</script>
